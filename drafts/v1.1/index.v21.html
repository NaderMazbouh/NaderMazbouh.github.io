<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ripple Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: alert → day strip → today in brief → outlook → impact map + ranked events → trends → economy/Lebanon lanes → sources. One column on phones. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18221d; --muted:#5c6a62; --line:#d9e0da; --land:#dfe6e0; --sea:#eef3f0;
  --cedar:#1f6a4a; --cedar-soft:#e2efe8; --amber:#a65d00; --amber-soft:#fbefdc; --red:#b3261e; --red-soft:#fbe6e4; --blue:#2f6fd6;
  --f-display:"Bricolage Grotesque","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#18201c; --ink:#e6ece8; --muted:#9aa8a0; --line:#2a352f; --land:#26322c; --sea:#151d19;
  --cedar:#5fc495; --cedar-soft:#1c2f26; --amber:#f0a54a; --amber-soft:#33281a; --red:#f2857c; --red-soft:#3a1f1d; --blue:#6fa3f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#18201c; --ink:#e6ece8; --muted:#9aa8a0; --line:#2a352f; --land:#26322c; --sea:#151d19;
  --cedar:#5fc495; --cedar-soft:#1c2f26; --amber:#f0a54a; --amber-soft:#33281a; --red:#f2857c; --red-soft:#3a1f1d; --blue:#6fa3f2; color-scheme:dark}
html[lang="ar"]{--f-display:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 56px;display:grid;gap:26px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
a{color:var(--cedar)}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cedar);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-family:var(--f-body)}
.note{font-size:13px;color:var(--muted);max-width:80ch;margin:0}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.brand{display:grid;gap:2px}
.brand h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.01em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--cedar);background:var(--cedar);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:7px 12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.status{font-size:13px;color:var(--muted);flex-basis:100%;text-align:end}
.status.err{color:var(--red)}.status.run{color:var(--amber)}

/* alert */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--red-soft);border:1px solid var(--red);border-radius:6px;padding:12px 16px}
.alert .dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.alert .dot{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 5%,transparent)}}}
.alert p{margin:0}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 auto;display:grid;justify-items:center;gap:4px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-weight:500;min-width:72px}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.day .dd{font-family:var(--f-mono);font-size:12px}
.day .sw{width:10px;height:10px;border-radius:50%}

/* sections */
.sec{display:grid;gap:14px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sec-h h2{font-size:20px}
.sec-h .aside{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}

/* today */
.today{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.bottomline{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--cedar);border-radius:6px;padding:16px 20px;display:grid;gap:8px;align-content:start}
.bottomline p{margin:0;font-size:clamp(16px,1.9vw,19px);line-height:1.5;max-width:75ch}
.changes{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--cedar-soft);color:var(--cedar)}
.chip.new{background:var(--blue);color:#fff}.chip.escalating{background:var(--red-soft);color:var(--red)}.chip.easing{background:var(--cedar-soft);color:var(--cedar)}.chip.ongoing{background:transparent;border:1px solid var(--line);color:var(--muted)}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;align-content:start}
.ind div{background:var(--surface);padding:10px 12px;display:grid;gap:1px;min-width:0}
.ind .k{font-size:12px;color:var(--muted)}
.ind .v{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.ind .c{font-size:11.5px;color:var(--muted)}
.ind .d{font-family:var(--f-mono);font-size:11.5px}
.d.up{color:var(--red)}.d.down{color:var(--cedar)}

/* outlook */
.outlook{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}
.panel h3{font-size:16px}
.fc{list-style:none;margin:0;padding:0;display:grid}
.fc li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.fc li:last-child{border-bottom:0}
.fc .v{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.fc .by{grid-column:1/-1;font-size:12px;color:var(--muted)}
.scen{display:grid;gap:12px}
.sc{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sc:last-child{border-bottom:0;padding-bottom:0}
.sc-top{display:flex;align-items:baseline;gap:10px}
.sc-top strong{font-family:var(--f-display);font-size:16px;font-weight:500}
.sc-top .p{margin-inline-start:auto;font-family:var(--f-mono);font-weight:600}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar span{display:block;height:100%}
.sc.base .pbar span{background:var(--amber)}.sc.better .pbar span{background:var(--cedar)}.sc.worse .pbar span{background:var(--red)}
.sc dl{margin:0;display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;font-size:14px}
.sc dt{color:var(--muted);font-size:12.5px;padding-top:2px}
.sc dd{margin:0}
.est{font-size:11px;font-weight:600;color:var(--amber);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-inline-start:6px}

/* map + events */
.events{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.mapcol{display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;direction:ltr}
.mapbox .pin{cursor:pointer}
.mapbox .pin:focus{outline:none}
.mapbox .pin:focus .ring,.mapbox .pin.sel .ring{stroke:var(--ink);stroke-width:2}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.legend .bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#2f6fd6,#2aa3b8,#d9a400,#e8681a,#d0261d)}
html[lang="ar"] .legend .bar{background:linear-gradient(270deg,#2f6fd6,#2aa3b8,#d9a400,#e8681a,#d0261d)}
.pop{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.pop h3{font-size:15px;font-weight:500}
.evlist{display:grid;gap:12px;min-width:0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:8px;min-width:0;scroll-margin-top:16px}
.item.sel{border-color:var(--ink)}
.item h3{font-size:16px;font-weight:500}
.item p{margin:0}
.ev-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.score{display:grid;justify-items:center;gap:2px;min-width:48px}
.score b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:15px;font-weight:600;color:#fff}
.score span{font-size:10.5px;color:var(--muted)}
.when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--cedar-soft);color:var(--cedar)}
.tag.indirect{background:var(--amber-soft);color:var(--amber)}
.tag.high{background:var(--red-soft);color:var(--red)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400}
.breakdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:8px;border-top:1px dashed var(--line)}
.breakdown div{display:grid;gap:3px;font-size:12px;min-width:0}
.breakdown .k{color:var(--muted)}
.breakdown .v{font-family:var(--f-mono);font-weight:600}
.minibar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--ink);opacity:.7}
.detail{font-size:12.5px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;align-items:center}
.links .best{font-weight:600}

/* indicators */
.today{grid-template-columns:1fr !important}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;opacity:.7}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:3px;align-content:start;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .c{font-size:12px;color:var(--muted)}
.tile .d{font-family:var(--f-mono);font-size:11.5px}
.tile svg{width:100%;height:auto;display:block;direction:ltr;margin-top:4px}
.tile .why{font-size:12.5px;line-height:1.45;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
.tile a{font-size:12px}
details.fold{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.fold summary{cursor:pointer;font-weight:600;font-family:var(--f-display);display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fold summary .cur{font-weight:400;font-size:12.5px;color:var(--muted);font-family:var(--f-body)}
details.fold[open] summary{margin-bottom:12px}
details.fold .inner{display:grid;gap:16px}
.tr{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.tr .k{font-size:12.5px;color:var(--muted)}
.tr .v{font-family:var(--f-mono);font-size:18px;font-weight:600}
.tr svg{width:100%;height:auto;display:block;direction:ltr}

.chain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.lane{display:grid;gap:12px;min-width:0}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.watch{list-style:none;margin:0;padding:0;display:grid}
.watch li{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.watch .d{font-family:var(--f-mono);font-size:12.5px;color:var(--cedar)}
.src{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:14px}
.src a{word-break:break-word}
details.method{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
details.method summary{cursor:pointer;font-weight:600}
details.method p{margin:.6em 0 0;font-size:14px;max-width:85ch}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:28px;display:grid;gap:8px}
.empty h2{font-size:20px}
/* menu + windows */
.wrap{zoom:var(--zoom,1)}
.menuwrap{position:relative}
button.icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:38px;height:38px;min-width:38px;padding:0;line-height:0;background:transparent;color:var(--ink);border:1px solid var(--line);-webkit-appearance:none;appearance:none}
button.icon svg{display:block;flex:0 0 20px;width:20px;height:20px;overflow:visible;pointer-events:none}
button.icon[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:20;min-width:190px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:grid}
.menu button{display:flex;align-items:center;gap:10px;background:transparent;color:var(--ink);border:0;border-radius:6px;padding:10px 12px;font-weight:500;text-align:start}
.menu button:hover,.menu button:focus-visible{background:var(--cedar-soft);color:var(--cedar);outline:none}
.menu svg{width:18px;height:18px;flex:0 0 auto}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,12,.45);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:min(86vh,900px);overflow:auto;display:grid;gap:16px;padding:18px 20px 22px;zoom:var(--zoom,1)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-18px;background:var(--surface);padding-top:2px}
.sheet-h h2{font-size:20px}
.sheet h3{font-size:15px;margin-top:4px}
.sheet p{margin:0;font-size:14.5px}
.fontlist{display:grid;gap:6px;margin:0;padding:0;border:0}
.fontlist legend{font-weight:600;margin-bottom:6px;font-family:var(--f-display)}
.fopt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.fopt:has(input:checked){border-color:var(--cedar);background:var(--cedar-soft)}
.fopt input{margin-top:5px;accent-color:var(--cedar)}
.fopt .fn{font-weight:600}
.fopt .fd{grid-column:2;font-size:12.5px;color:var(--muted)}
.fopt .fp{grid-column:2;font-size:16px;line-height:1.5}
.signin{display:grid;gap:10px}
.signin button{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:11px 14px}
.signin small{font-weight:400;color:var(--muted)}
.about-sec{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.tblwrap{overflow-x:auto}
.utbl{width:100%;border-collapse:collapse;font-size:13.5px}
.utbl th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.utbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.utbl tr.cur td{background:var(--cedar-soft)}
.utbl tr.cur td:first-child{font-weight:600}
.sheet p.devmark{font-family:"Syne","Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:44px;line-height:1;letter-spacing:.14em;color:var(--cedar);justify-self:start;padding-block:6px 4px;border-bottom:3px solid currentColor}
/* date badge */
.datebadge{display:grid;line-height:1.15;padding-inline-end:12px;margin-inline-end:4px;border-inline-end:1px solid var(--line)}
.datebadge .dw{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cedar)}
html[lang="ar"] .datebadge .dw{letter-spacing:0;font-size:12px}
.datebadge .dd{font-family:var(--f-display);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* check marks */
.item{position:relative}
.chk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;flex:0 0 auto}
.chk svg{width:13px;height:13px}
.chk.on{background:#1fae5b;color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,#1fae5b 25%,transparent),0 0 10px color-mix(in srgb,#1fae5b 55%,transparent)}
.chk.off{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.item > .chk{position:absolute;top:12px;inset-inline-end:12px}
.item.has-chk h3{padding-inline-end:26px}
.changes{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13.5px}
.changes span.grp{display:inline-flex;align-items:center;gap:6px}
.changes .chk{width:18px;height:18px}.changes .chk svg{width:11px;height:11px}
/* plain impact rows */
.imp2{display:grid;gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:13.5px}
.irow .q{font-weight:600}
.irow .pts{font-family:var(--f-mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.irow .a{grid-column:1/-1;color:var(--ink)}
.irow .minibar{grid-column:1/-1}
details.help{font-size:13.5px}
details.help summary{cursor:pointer;color:var(--cedar);font-weight:600}
details.help p{margin:.5em 0 0;max-width:80ch}
/* more sources */
details.more{font-size:13.5px}
details.more summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"▾";font-size:11px}
details.more[open] summary::after{content:"▴"}
details.more ul{list-style:none;margin:6px 0 0;padding:8px 10px;display:grid;gap:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
details.more li{display:grid;gap:1px}
details.more li span{font-size:12px;color:var(--muted)}
/* translate bar */
.trbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--amber-soft);border:1px solid var(--amber);border-radius:6px;padding:10px 14px}
.trbar p{margin:0}

  /* ---------- impact score ---------- */
  function impact(e){
    const g=Number(e.goldstein);
    const S = isFinite(g) ? Math.max(0,Math.min(1,(10-g)/20)) : null;
    const mv = e.marketMovePct;
    const M = (mv===null || mv===undefined || !isFinite(Number(mv))) ? null : Math.min(Math.abs(Number(mv))/5,1);
    const c = e.casualties || {};
    const H = c.known===false ? null : Math.min(Math.log10(1+(Number(c.killed)||0)+0.25*(Number(c.injured)||0))/3,1);
    const s=S===null?0:50*S, m=M===null?0:25*M, h=H===null?0:25*H;
    return {score:Math.round(s+m+h), s, m, h, missM:M===null, missH:H===null, missS:S===null, c};
  }
  const STOPS=[[0,[47,111,214]],[25,[42,163,184]],[50,[217,164,0]],[75,[232,104,26]],[100,[208,38,29]]];
  function scoreColor(v){
    v=Math.max(0,Math.min(100,v));
    for (let i=1;i<STOPS.length;i++){ if (v<=STOPS[i][0]){ const [a,ca]=STOPS[i-1],[b,cb]=STOPS[i],f=(v-a)/(b-a); const c=ca.map((x,j)=>Math.round(x+(cb[j]-x)*f)); return `rgb(${c.join(",")})`; } }
    return "rgb(208,38,29)";
  }
  const maxScore = b => Math.max(0,...(b.politics||[]).map(p=>impact(p).score));

  /* ---------- map ---------- */
  const W=800,H=400;
  const my = lat => { const r=Math.max(-80,Math.min(80,lat))*Math.PI/180; return Math.log(Math.tan(Math.PI/4+r/2)); };
  function drawMap(pts){
    pts = pts.filter(p=>isFinite(p.lat)&&isFinite(p.lon));
    let lo0=20,lo1=60,la0=15,la1=45;
    if (pts.length){ lo0=Math.min(...pts.map(p=>p.lon)); lo1=Math.max(...pts.map(p=>p.lon)); la0=Math.min(...pts.map(p=>p.lat)); la1=Math.max(...pts.map(p=>p.lat)); }
    const cx=(lo0+lo1)/2, span=Math.max(lo1-lo0+14,30);
    let ya=my(la0-5), yb=my(la1+5); if (yb-ya<.5){ const mm=(ya+yb)/2; ya=mm-.25; yb=mm+.25; }
    const k=Math.min(W/(span*Math.PI/180), H/(yb-ya)), cy=(ya+yb)/2;
    const X=lon=>W/2+k*((lon-cx)*Math.PI/180), Y=lat=>H/2-k*(my(lat)-cy);
    let d="";
    for (const r of LAND){ let prev=null,seg="",broken=false; for(let i=0;i<r.length;i+=2){ const lon=r[i],lat=r[i+1]; const cmd=(prev===null||Math.abs(lon-prev)>180)?"M":"L"; if(cmd==="M"&&prev!==null)broken=true; seg+=cmd+X(lon).toFixed(1)+","+Y(lat).toFixed(1); prev=lon; } d+=seg+(broken?"":"Z"); }
    const grid=[]; for(let lo=-180;lo<=180;lo+=10){const x=X(lo); if(x>-5&&x<W+5)grid.push(`<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}"/>`);} for(let la=-80;la<=80;la+=10){const y=Y(la); if(y>-5&&y<H+5)grid.push(`<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}"/>`);}
    const ord=[...pts].sort((a,b)=>a.score-b.score);
    const pins=ord.map(p=>{ const c=scoreColor(p.score), r=5+p.score/25; return `<g class="pin${selEvent===p.i?" sel":""}" data-i="${p.i}" tabindex="0" role="button" aria-label="${esc(p.title)}, ${p.score}/100" transform="translate(${X(p.lon).toFixed(1)},${Y(p.lat).toFixed(1)})"><circle r="${(r+7).toFixed(1)}" fill="${c}" opacity=".2"/><circle class="ring" r="${r.toFixed(1)}" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/></g>`; }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map"><rect width="${W}" height="${H}" fill="var(--sea)"/><g stroke="var(--line)" stroke-width=".6" opacity=".7">${grid.join("")}</g><path d="${d}" fill="var(--land)" stroke="var(--line)" stroke-width=".8" fill-rule="evenodd"/>${pins}</svg>`;
  }

  /* ---------- trend chart ---------- */
  function spark(points, color){
    const pts=(points||[]).filter(p=>p&&p.d&&isFinite(Number(p.v))).map(p=>({x:new Date(p.d+"T12:00:00").getTime(),v:Number(p.v),d:p.d})).sort((a,b)=>a.x-b.x);

    const w=320,h=110,pl=6,pr=6,pt=10,pb=22;
    const x0=pts[0].x,x1=pts[pts.length-1].x; let v0=Math.min(...pts.map(p=>p.v)),v1=Math.max(...pts.map(p=>p.v)); const pad=(v1-v0)*.12||Math.abs(v1)*.05||1; v0-=pad; v1+=pad;
    const X=x=>pl+(w-pl-pr)*(x1===x0?.5:(x-x0)/(x1-x0)), Y=v=>pt+(h-pt-pb)*(1-(v-v0)/(v1-v0));

  function evalRule(r, cur){
    if (!isFinite(cur)) return false;
    if (r.type==="above") return cur>Number(r.value);
    if (r.type==="below") return cur<Number(r.value);
    if (r.type==="change") return isFinite(Number(r.base)) && cur!==Number(r.base);
    if (r.type==="move") return isFinite(Number(r.base)) && Number(r.base)!==0 && Math.abs(cur-Number(r.base))/Math.abs(Number(r.base))*100 >= Number(r.value);
    return false;
  }
  function snoozed(r, cur){ const s=PD.alerts.seen&&PD.alerts.seen[r.id]; if(!s) return false; if (r.type==="above") return cur<=Number(s.v); if (r.type==="below") return cur>=Number(s.v); return false; }

  const MOVE_KEYS=["usdlbp","gas95","diesel","gascyl","bread","gen_kwh","brent","gold","silver","wheat","sp500","vix","eurobond"];
  function weekMoves(from, to, b){
    const out=[];
    MOVE_KEYS.forEach(k=>{
      const pts=((series[k]&&series[k].points)||[]).filter(p=>p&&isoDay(p.d)&&isFinite(Number(p.v))).sort((a,c)=>a.d<c.d?-1:1);
      const start=[...pts].reverse().find(p=>p.d<=from) || pts.find(p=>p.d>=from&&p.d<=to), end=[...pts].reverse().find(p=>p.d<=to);
      if (!start||!end||start.d>=end.d) return;
      const i=(b.indicators||[]).find(x=>x.key===k); const lbl=(i&&i.label)||(series[k]&&series[k].label)||k;
      out.push({k, lbl, a:Number(start.v), z:Number(end.v), p:(Number(end.v)-Number(start.v))/Math.abs(Number(start.v))*100});
    });
    return out;
  }

    },()=>{});
    db.collection("series").onSnapshot(snap=>{ series={}; snap.docs.forEach(d=>{ series[d.id]=d.data(); }); if (briefs.length) render(); },()=>{});
    db.doc("meta/refresh").onSnapshot(s=>{ status=s.exists?s.data():null; updateRefreshUI(); },()=>{});
    db.doc("meta/translate").onSnapshot(s=>{ trState=s.exists?s.data():null; if(briefs.length) render(); },()=>{});
    db.doc("meta/alerts").onSnapshot(s=>{ const d=s.exists?s.data():null; if(d&&d.mode&&!alertSaving){ alertMode=d.mode==="off"?"morning":d.mode; if(openWin==="settings"){ const open=$("#foldAlerts")&&$("#foldAlerts").open; fillWin("settings"); if(open) $("#foldAlerts").open=true; } } },()=>{});
    db.doc("meta/refreshes").onSnapshot(s=>{ refUse=s.exists?s.data():null; updateRefreshUI(); },()=>{});
    db.doc("meta/models").onSnapshot(s=>{ const d=s.exists?s.data():null; if(!modelSaving){ liteModels=!!(d&&d.lite); if(openWin==="settings"){ const open=$("#foldModels")&&$("#foldModels").open; fillWin("settings"); if(open) $("#foldModels").open=true; } } },()=>{});
    db.doc("alerts/latest").onSnapshot(s=>{ latestAlert=s.exists?s.data():null; if(briefs.length) render(); },()=>{});
    db.collection("forecasts").onSnapshot(snap=>{ forecasts=snap.docs.map(d=>Object.assign({id:d.id},d.data())); if (briefs.length) render(); },()=>{});
    db.doc("meta/fx").onSnapshot(s=>{ fx=s.exists?s.data():null; if (econTab==="expat") refreshPane(); },()=>{});
    await initPersonal();
    render();
    const caps = await Promise.all([claude.use("downloads").catch(()=>null), isOwner ? claude.use("mcp").catch(()=>null) : Promise.resolve(null)]);
    dl=caps[0]; mcp=caps[1];
    updateRefreshUI(); render();
  })();
})();
</script>

</body></html>
